<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Learning Connection: Meet Michael</title>
    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style type="text/css">
        @font-face {
            font-family: 'VC Nudge';
            src: url('https://my.sideby.ai/style/fonts/web/VCNudgeNormal-Bold.woff2') format('woff2'),
                 url('https://my.sideby.ai/style/fonts/web/VCNudgeNormal-Bold.woff') format('woff');
            font-weight: bold;
            font-display: swap;
        }
        @font-face {
            font-family: 'Clash Grotesk';
            src: url('https://my.sideby.ai/style/fonts/web/clashgrotesk/ClashGrotesk-Regular.woff2') format('woff2'),
                 url('https://my.sideby.ai/style/fonts/web/clashgrotesk/ClashGrotesk-Regular.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'PP Neue Machina';
            src: url('https://my.sideby.ai/style/fonts/web/PP Neue Machina/PPNeueMachina-PlainRegular.woff2') format('woff2'),
                 url('https://my.sideby.ai/style/fonts/web/PP Neue Machina/PPNeueMachina-PlainRegular.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #FBF6E3; font-family: 'Clash Grotesk', Arial, sans-serif;">
    <!-- Email Container -->
    <div style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #FBF6E3;">
        
        <!-- Header with Brand Accent and Wavy Design -->
        <div style="background: linear-gradient(135deg, #F67201 0%, #FF8A3D 100%); position: relative; overflow: hidden;">
            <!-- Enhanced Wave Pattern -->
            <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: url('data:image/svg+xml;charset=utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 120%22%3E%3Cpath d=%22M0,60L50,65C100,70,200,80,300,75C400,70,500,50,600,55C700,60,800,90,900,85C1000,80,1100,40,1150,35L1200,30L1200,0L1150,0C1100,0,1000,0,900,0C800,0,700,0,600,0C500,0,400,0,300,0C200,0,100,0,50,0L0,0Z%22 fill=%22%23ffffff%22 fill-opacity=%220.08%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-size: cover;"></div>
            
            <!-- Logo Section -->
            <div style="position: relative; z-index: 2; padding: 40px 0 60px 0; text-align: center;">
                <img src="https://my.sideby.ai/lovable-uploads/4fa666a9-c191-4ff7-9213-c43d4c9fc9aa.png" alt="sideby" style="width: 160px; height: auto; display: inline-block;">
            </div>
            
            <!-- Bottom Wave -->
            <div style="position: absolute; bottom: -1px; left: 0; right: 0; height: 20px; background-image: url('data:image/svg+xml;charset=utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 20%22%3E%3Cpath d=%22M0,0L50,3C100,6,200,12,300,10C400,8,500,0,600,2C700,4,800,16,900,14C1000,12,1100,4,1150,0L1200,0L1200,20L0,20Z%22 fill=%22%23FBF6E3%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-size: cover;"></div>
        </div>

        <!-- Main Content -->
        <div style="padding: 64px 40px; text-align: center; background-color: #FBF6E3;">
            
            <!-- Main Heading -->
            <h1 class="main-heading" style="font-family: 'VC Nudge', Arial, sans-serif; font-size: 42px; line-height: 110%; letter-spacing: 1%; color: #401612; margin: 0 0 16px 0; font-weight: bold;">
                New Learning Connection: Meet Michael
            </h1>
            
            <!-- Optional Subtext -->
            <p class="subtext" style="font-family: 'Clash Grotesk', Arial, sans-serif; font-size: 18px; line-height: 140%; letter-spacing: 0%; color: #401612; margin: 0 0 32px 0; opacity: 0.8;">
                from the second
            </p>
            
            <!-- Body Text -->
            <p class="body-text" style="font-family: 'Clash Grotesk', Arial, sans-serif; font-size: 16px; line-height: 150%; letter-spacing: 0%; color: #401612; margin: 0 0 40px 0; max-width: 480px; margin-left: auto; margin-right: auto;">
                Log in to your sideby dashboard to connect with your match and schedule your first session.
            </p>

            <!-- Call to Action Button -->
            <div style="text-align: center; margin: 40px 0;">
                <a href="{{DASHBOARD_URL}}" class="cta-button" style="
                    font-family: 'PP Neue Machina', Arial, sans-serif;
                    font-size: 18px;
                    line-height: 110%;
                    letter-spacing: -1%;
                    background-color: #F67201;
                    color: #401612;
                    text-decoration: none;
                    padding: 14px 28px;
                    border-radius: 6px;
                    display: inline-block;
                    font-weight: normal;
                    transition: all 0.3s ease;
                    border: none;
                    min-width: 180px;
                ">
                    Go to Dashboard
                </a>
            </div>

        </div>

        <!-- Footer -->
        <div style="padding: 40px 40px 60px 40px; text-align: center; background-color: #FBF6E3; border-top: 1px solid rgba(64, 22, 18, 0.1);">
            <p style="font-family: 'Clash Grotesk', Arial, sans-serif; font-size: 16px; line-height: 150%; color: #401612; margin: 0 0 16px 0; opacity: 0.7;">
                You received this email because you're a member of the sideby learning community.
            </p>
            <p style="margin: 0;">
                <a href="{{MANAGE_NOTIFICATIONS_URL}}" style="
                    font-family: 'Clash Grotesk', Arial, sans-serif;
                    font-size: 16px;
                    color: #F67201;
                    text-decoration: underline;
                    text-decoration-color: #F67201;
                    text-underline-offset: 4px;
                ">
                    Manage notifications
                </a>
            </p>
            <p style="font-family: 'Clash Grotesk', Arial, sans-serif; font-size: 14px; color: #401612; margin: 24px 0 0 0; opacity: 0.5;">
                &copy; {{CURRENT_YEAR}} sideby
            </p>
        </div>

    </div>

    <!-- Mobile Responsive Adjustments -->
    <style type="text/css">
        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
                margin: 0 !important;
            }
            
            .main-heading {
                font-size: 32px !important;
                line-height: 110% !important;
                padding: 0 16px !important;
            }
            
            .subtext {
                font-size: 16px !important;
                padding: 0 16px !important;
            }
            
            .body-text {
                font-size: 15px !important;
                padding: 0 16px !important;
            }
            
            .cta-button {
                font-size: 16px !important;
                padding: 12px 24px !important;
                margin: 0 16px !important;
            }
            
            .content-padding {
                padding: 40px 24px !important;
            }
            
            .footer-padding {
                padding: 32px 24px 48px 24px !important;
            }
        }
        
        @media only screen and (max-width: 480px) {
            .main-heading {
                font-size: 28px !important;
                line-height: 105% !important;
            }
            
            .subtext {
                font-size: 15px !important;
            }
            
            .body-text {
                font-size: 14px !important;
            }
            
            .cta-button {
                font-size: 15px !important;
                padding: 12px 20px !important;
            }
        }
    </style>

</body>
</html>
